name = "tailwatch-collector"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Region this deployment serves. A site key is valid only in its own region.
[vars]
REGION = "in"

# Stage 2: edge collector bindings.
# Replace the placeholder KV id before deploying to a real account.
[[kv_namespaces]]
binding = "SITE_CONFIG"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"

[[queues.producers]]
binding = "EVENTS"
queue = "tailwatch-events"

# Per-site limiter (keyed by public key), applied before the KV lookup.
# Replace namespace_id with a real account namespace before production deploy.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 600
  period = 10

# Per-client limiter, applied before the body is read.
[[ratelimits]]
name = "RATE_LIMITER_IP"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 100
  period = 10
name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build # fails if tw.js is over the 3 KB gzip budget (invariant 13)

  # Stage 1-3 done-when against real servers: MongoDB rules, the Workers runtime (Miniflare/workerd) and ClickHouse.
  pipeline:
    runs-on: ubuntu-latest
    needs: verify
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports: ['8123:8123']
        env:
          # A password makes the image open the default user to the network (the port mapping);
          # access management lets the tests create their throwaway INSERT-only user.
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ci-only-password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    env:
      TW_CH_URL: http://127.0.0.1:8123
      TW_CH_USER: default
      TW_CH_PASSWORD: ci-only-password
      # Single-node replica set: Stage 5 signup uses a transaction (same setup as the owner's machine).
      TW_MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: start MongoDB as a single-node replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 60); do docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for i in $(seq 60); do docker exec mongo mongosh --quiet --eval 'rs.status().myState' | grep -q '^1$' && break; sleep 1; done
      - name: wait for ClickHouse
        run: for i in $(seq 60); do curl -sf http://127.0.0.1:8123/ping && exit 0; sleep 2; done; exit 1
      - run: pnpm verify:mongo
      # Stage 4: the tracker runs in a real Chromium against the collector on workerd.
      - run: pnpm --filter @tailwatch/collector exec playwright-core install --with-deps chromium
      - run: pnpm --filter @tailwatch/collector e2e
      # Stage 4 done-when: Next.js App Router, Vite React SPA and a Vue hash-router app in dev mode.
      - run: pnpm e2e:frameworks
      - run: pnpm --filter @tailwatch/consumer live
      - run: pnpm --filter @tailwatch/consumer e2e
      # Stage 5: the API on the real MongoDB replica set, then onboarding through the dashboard in Chromium.
      - run: pnpm live:api
      - run: pnpm e2e:api
